services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nrdc_r2c
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - nrdc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nrdc_r2c"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nrdc_postgres_data:
